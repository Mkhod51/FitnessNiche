id: c-diet-breaks-trained-females-body-composition
statement: >-
  In resistance-trained females, a trial did not detect a body-composition difference
  between six weeks of continuous 25% energy restriction and an eight-week intermittent
  programme containing six restricted weeks in two-week blocks separated by two one-week
  energy-balance breaks
peekStatement: >-
  A small trial suggests no detectable body-composition advantage from diet breaks.
