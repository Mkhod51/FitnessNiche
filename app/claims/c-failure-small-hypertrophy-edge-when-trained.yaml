    claimId: c-failure-small-hypertrophy-edge-when-trained
    doi: 10.1016/j.jshs.2021.01.007
    authors: Grgic J, Schoenfeld BJ, Orazem J, Sabol F
    year: 2022
    journal: Journal of Sport and Health Science
    n: null
    population: trained
    effectSize: >-
      In the resistance-trained subgroup only, training to failure favoured
      hypertrophy with ES 0.15. This is a subgroup analysis inside a single
      meta-analysis and its interval only just clears zero, so it carries much
      less weight than the headline null result it sits beside. The trained
      subgroup is drawn from six of the fifteen studies; the paper does not
      report a participant count for that subgroup alone, so n stays unstated
      even though the pooled hypertrophy analysis it came from had 219.
    ci: 95% CI 0.03 to 0.26
