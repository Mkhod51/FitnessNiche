    claimId: c-protein-timing-total-intake-dominates
    doi: 10.1186/1550-2783-10-53
    authors: Schoenfeld BJ, Aragon AA, Krieger JW
    year: 2013
    journal: Journal of the International Society of Sports Nutrition
    n: 525
    population: unstated
    effectSize: >-
      A simple pooled analysis showed a small-to-moderate effect of timing on
      hypertrophy, but in the full meta-regression controlling for covariates no
      significant difference remained for either strength or hypertrophy. Total
      protein intake was the strongest predictor of effect-size magnitude. Graded B
      rather than A: one meta-analysis from 2013, not replicated in this base, and the
      training status of its pooled subjects was not stated in the source we read.
