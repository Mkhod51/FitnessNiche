id: c-deload-periodic-break-untrained
statement: >-
  In healthy untrained adults, 10 weeks of detraining reduced strength and muscle size,
  but 10 weeks of retraining produced final adaptations similar to a matched 20-week continuous-training block
peekStatement: >-
  In untrained adults, a 10-week break reduced gains that retraining later regained.
