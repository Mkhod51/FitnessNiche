    claimId: c-deloads-not-evidence-backed
    doi: 10.7717/peerj.16777
    authors: Coleman M, Burke R, Augustin F, Pinero A, Maldonado J, Fisher JP, Israetel M, Androulakis Korakakis P, Swinton P, Oberlin D, Schoenfeld BJ
    year: 2024
    journal: PeerJ
    n: 39
    population: trained
    effectSize: >-
      A one-week deload at the midpoint of a nine-week programme produced no
      appreciable difference in muscle size, local endurance or power, while the
      continuously-training group showed greater gains in both isometric and
      dynamic lower-body strength. This is a single trial of 39 people; no
      meta-analysis of deloading in trained lifters exists to weigh it against.
