id: c-deloads-not-evidence-backed
statement: >-
  Planned deload weeks are widely prescribed but barely studied, and the one
  controlled trial in trained lifters found they cost strength without helping
  muscle growth
peekStatement: >-
  Planned deloads are barely studied, and one trial found they cost strength
