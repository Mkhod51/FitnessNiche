id: c-bulk-rate-higher-energy-muscle-mass
statement: >-
  In an 11-person, four-week trial of competitive male bodybuilders, the higher-energy diet
  group with a different macronutrient distribution had a larger estimated skeletal-muscle-mass increase than the moderate-energy group (2.7% vs 1.1%)
peekStatement: >-
  A small trial suggests greater estimated muscle-mass gains in the higher-energy diet group.
