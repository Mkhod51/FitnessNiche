id: c-refeed-dry-fat-free-mass-trained-adults
statement: >-
  In a seven-week trial of resistance-trained adults, two carbohydrate-refeed days per week
  during energy restriction produced a smaller loss of dry fat-free mass than continuous restriction
peekStatement: >-
  A small trial suggests less dry fat-free-mass loss with weekly carbohydrate refeeds.
