    effectSize: >-
      No pooled effect estimate. This is an expert position stand reasoning from
      acute muscle-protein-synthesis measurements, not from chronic hypertrophy
      trials. It recommends 20-40 g doses (0.25-0.40 g/kg) every three to four
      hours, and notes post-exercise protein raises synthesis rates. The same
      document names meeting total daily intake as the primary emphasis.
