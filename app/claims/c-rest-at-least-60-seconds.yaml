  - id: cit-rest-singer
    claimId: c-rest-at-least-60-seconds
    doi: 10.3389/fspor.2024.1429789
    authors: Singer A, Wolf M, Generoso L, Arias E, Delcastillo K, Echevarria E, Martinez A, Androulakis Korakakis P, Refalo MC, Swinton PA, Schoenfeld BJ
    year: 2024
    journal: Frontiers in Sports and Active Living
    n: null
    population: unstated
    effectSize: >-
      Central estimates favoured longer rest for the arm (0.13) and thigh (0.17)
      and marginally favoured shorter rest for the whole body (-0.08). Every one
      of those controlled credible intervals crosses zero, so the direction is
      consistent but the effect is not clearly distinguishable from none. The
      authors conclude a small benefit to resting beyond 60 s, and separately
      report detecting no appreciable difference beyond 90 s — that upper bound
      is the source of the 90-second figure in the statement.
    ci: >-
      Arm 95% CrI -0.27 to 0.51; thigh 95% CrI -0.13 to 0.43; whole body 95% CrI
      -0.45 to 0.29
