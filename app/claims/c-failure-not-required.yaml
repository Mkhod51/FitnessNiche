    claimId: c-failure-not-required
    doi: 10.1016/j.jshs.2021.01.007
    authors: Grgic J, Schoenfeld BJ, Orazem J, Sabol F
    year: 2022
    journal: Journal of Sport and Health Science
    n: 394
    population: mixed
    effectSize: >-
      No significant difference between training to failure and stopping short,
      for strength (ES -0.09) or hypertrophy (ES 0.22). Both confidence
      intervals cross zero. n is the pooled strength analysis (394); the
      hypertrophy analysis pooled a separate, smaller 219 participants, so the
      size half of this claim rests on less data than the strength half. Six of
      the fifteen studies used resistance-trained participants and the rest used
      untrained ones.
    ci: >-
      Strength 95% CI -0.22 to 0.05; hypertrophy 95% CI -0.11 to 0.55
